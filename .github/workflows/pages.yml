name: Reproduce and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --locked --extra before
      - run: uv run --locked --extra before ruff check .
      - run: uv run --locked --extra before pytest -q
      - name: Reproduce baseline
        run: uv run --locked --extra before python reproduce.py --output results/baseline.json
      - name: Reproduce actual patched loader
        run: >-
          uv run --locked --extra after
          python reproduce.py --baseline results/baseline.json --output site/masks.json
      - name: Verify published measurements
        run: |
          git diff --exit-code -- site/masks.json
          uv run --locked --extra before pytest -q
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: reproduce
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
